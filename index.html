<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" id="avatar" src="https://via.placeholder.com/180x180" alt=".">
            <h1 class="profile-name" id="name"></h1>
            <h2 class="profile-username" id="username"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a href="#" id="link" class="profile-link">Ver no Github</a>
        </div>
    </header>

    <script src="jquery-3.7.1.min.js"></script>
    <script>
        
        $(document).ready(function(){
            const endpoint = `https://api.github.com/users/jonasGMaia`;
            $.ajax(endpoint).done(function(resposta){
                const avatar = resposta.avatar_url;
                $('#avatar').attr('src',avatar);
                const name = resposta.name;
                $('#name').text(name);
                const username = resposta.login;
                $('#username').text(username);
                const repos = resposta.public_repos;
                $('#repos').text(repos);
                const followers = resposta.followers;
                $('#followers').text(followers);
                const following = resposta.following;
                $('#following').text(following);
                const link = resposta.html_url;
                $('#link').attr('href',link);
            })
        })
    </script>
</body>
</html>
